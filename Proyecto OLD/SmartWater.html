<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartWater Santa Marta | Monitoreo de Agua</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="SmartWater.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- Pantalla de login - credenciales fijas porque es demo nomás -->
<div id="loginScreen" class="login-container">
    <div class="login-card">
        <div class="login-header"><i class="fas fa-water"></i><h2>SmartWater Santa Marta</h2><p>Monitoreo IoT · Agua Potable Inteligente</p></div>
        <form id="loginForm">
            <div class="input-group"><label><i class="fas fa-user"></i> Usuario</label><input type="text" id="username" placeholder="admin" required></div>
            <div class="input-group"><label><i class="fas fa-lock"></i> Contraseña</label><input type="password" id="password" placeholder="••••••" required></div>
            <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> Ingresar</button>
        </form>
        <div class="demo-creds"><i class="fas fa-info-circle"></i> Usuario: <strong>admin</strong> / Contraseña: <strong>santamarta2026</strong></div>
    </div>
</div>

<div id="mainApp" class="main-app">
    <div class="app-header">
        <div class="logo-area"><h2><i class="fas fa-tint"></i> AguaSmart Santa Marta</h2><span>Monitoreo en tiempo real</span></div>
        <div class="user-info"><span><i class="fas fa-user-check"></i> <span id="userNameDisplay">Operador</span></span><button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Salir</button></div>
    </div>
    <div class="categories-nav" id="categoriesNav">
        <!-- Cada botón carga una sección distinta, bien simple -->
        <button class="cat-btn active" data-section="problematica"><i class="fas fa-exclamation-triangle"></i> Problemática</button>
        <button class="cat-btn" data-section="viabilidad"><i class="fas fa-chart-line"></i> Viabilidad</button>
        <button class="cat-btn" data-section="objetivos"><i class="fas fa-bullseye"></i> Objetivos</button>
        <button class="cat-btn" data-section="foda"><i class="fas fa-chart-simple"></i> FODA</button>
        <button class="cat-btn" data-section="rf"><i class="fas fa-microchip"></i> Requerimientos</button>
        <button class="cat-btn" data-section="monitoreo"><i class="fas fa-tachometer-alt"></i> Monitoreo IoT</button>
        <button class="cat-btn" data-section="alertas"><i class="fas fa-bell"></i> Alertas</button>
        <button class="cat-btn" data-section="sostenibilidad"><i class="fas fa-leaf"></i> Sostenibilidad</button>
        <button class="cat-btn" data-section="reportes"><i class="fas fa-file-alt"></i> Reportes</button>
    </div>
    <div class="content-pane" id="dynamicContent"></div>
    <footer><i class="fas fa-charging-station"></i> Proyecto SmartWater · Santa Marta · Tecnología IoT</footer>
</div>
    <script src="SmartWater.js"></script>
</body>
</html>
